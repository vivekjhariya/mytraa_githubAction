name: myntraa pipeline

on: 
    push:
       branches: [main]
    pull_request:
       branches: [main]
env:
    IMAGE_NAME: mytraa
    DOCKERHUB_REPO: vjstylose/myntraa
    

jobs:
  ci:
     runs-on: ubuntu-latest
     
     steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: setup node
          uses: actions/setup-node@v4
          with:
            node-version: "20"
            cache: npm
            
        - name: install dependencies
          run: npm ci
          
        # -------- Trivy FS scan --------
         
        - name: Trivy FS scan
          uses: aquasecurity/trivy-action@master
          with:
            scan-type: fs
            scan-ref: .
            severity: CRITICAL,HIGH
            exit-code: "1"

        # ------- OWASP Dependency Check ------
         
        - name: OWASP dependency check
          uses: dependency-check/Dependency-Check_Action@main
          with:
             project: myntraa
             path: .
             format: HTML
             args: --nvdApiKey ${{  secrets.NVD_API_KEY }} --failOnCVSS 7
             
        # ------- sonarqube -------
            
        - name: sonarQube Scan
          uses: sonarQube Scan
          uses: SonarSource/sonarqube-scan-action@v4
          env:
              SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              SONAR_HOST_URL: ${{  secrets.SONAR_HOST_URL }}
              
              
        - name: docker login      
          uses: docker/login-action@v3
          with:
             username: ${{ secrets.DOCKERHUB_USERNAME }}
             password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Build docker image
          run: |
              docker build -t $DOCKERHUB_REPO:build-${{ github.run_number }} .
              docker tag $DOCKERHUB_REPO:build-${{ github.run_number }} $DOCKERHUB_REPO:latest
              
        - name: Trivy image scan
          uses: aquasecurity/trivy-action@master
          with:
            scan-type: image
            image-ref: ${{ env.DOCKERHUB_REPO }}:build-${{ github.run_number }}
            severity: CRITICAL,HIGH
            exit-code: "1"
            
        - name: push docker image
          run: |
            docker push $DOCKERHUB_REPO:build-${{ github.run_number }}
            docker push $DOCKERHUB_REPO:latest    

deploy:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'   
    
    steps:
         - name: checkout
           uses: actions/checkout@v4

         - name: Create .env
           run: |
             cat > .env <<EOF
             APP_PORT=3001
             JWT_SECRET=${{ secrets.JWT_SECRET }}  
             MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
             MYSQL_DATABASE=mytraa_db
             MYSQL_USER=myntraa
             MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
             EOF

        - name: deploy with docker compose     
          run: |
          docker compose --env-file .env pull
          docker compose --env-file .env down || true
          docker compose --env-file .env up -d
          docker compose --env-file .env ps
    
       